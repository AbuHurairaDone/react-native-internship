        function renderProfile({ personalInfo, accountStatus, contact, professional, uid }){
            return `
                <article style="width: 280px; border: 1px solid #d1d5db; border-radius: 16px; background: #ffffff; padding: 16px; box-shadow: 0 10px 20px rgba(0,0,0,.08); margin: 10px;">
                    <div style="text-align: center; margin-bottom: 14px;">
                        <img src="${personalInfo.avatar}" alt="${personalInfo.displayName}" style="width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin-bottom: 12px;" />
                        <h2 style="margin: 0 0 6px; font-size: 1.1rem;">${personalInfo.displayName}</h2>
                        <p style="margin: 0; color: #6b7280;">${personalInfo.firstName} ${personalInfo.lastName}</p>
                    </div>
                    <div style="font-size: 0.95rem; color: #111827; line-height: 1.5;">
                        <p><strong>Status:</strong> ${accountStatus}</p>
                        <p><strong>Email:</strong> ${contact.email}</p>
                        <p><strong>Phone:</strong> ${contact.phone}</p>
                        <p><strong>Location:</strong> ${contact.location.city}, ${contact.location.country}</p>
                        <p><strong>Role:</strong> ${professional.role}</p>
                        <p><strong>Company:</strong> ${professional.company}</p>
                        <p><strong>Skills:</strong> ${professional.skills.join(', ')}</p>
                        <p><strong>UID:</strong> ${uid}</p>
                    </div>
                </article>`;
        }
        function renderProfiles(){
            document.getElementById("userprofiles").innerHTML = userProfiles.map(profile => renderProfile(profile)).join('');
        }       
        renderProfiles();
    </script>
