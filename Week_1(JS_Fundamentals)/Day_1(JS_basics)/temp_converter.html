<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
</head>
<body>
    <div style="height: 100vh;display: flex;align-items: center;justify-content: center;flex-direction: column;">
        <h1>Convert Fahrenheit (to/from) Celsius </h1>
        <div>
            <select style="padding: 10px;" id="from">
                <option value="Fahrenheit" selected>Fahrenheit</option>
                <option value="Celcius">Celcius</option>
            </select>
            <input style="padding: 10px;" type="number" name="from-value" id="from-value" />
        </div>
        <br><br>
        
        <div>
            <select style="padding: 10px;" id="to">
                <option value="Fahrenheit">Fahrenheit</option>
                <option value="Celcius" selected>Celcius</option>
            </select>
            <input style="padding: 10px;" type="number" name="to-value" id="to-value" />
        </div>
        <br><br>
        <button style="padding: 10px;" onclick="temp_convert()">Convert</button>
    </div>
    <script>
        let fromValue = document.getElementById('from-value')
        let toValue = document.getElementById('to-value')
        let to = document.getElementById('to')
        let from = document.getElementById('from')
      
        function temp_convert(){
            let answer = 0;
            if(from.value == to.value){
                alert("conversion not valid");
                return;
            }
            if(from.value == "Fahrenheit" && to.value == "Celcius"){
                answer = (fromValue.value-32)*(5/9)
            }else if(from.value == "Celcius" && to.value == "Fahrenheit"){
                answer = fromValue.value*(9/5)+32
            }else{
                alert("conversion not found");
                return;
            }

            document.getElementById('to-value').value = answer;
        }
    </script>
</body>
</html>
