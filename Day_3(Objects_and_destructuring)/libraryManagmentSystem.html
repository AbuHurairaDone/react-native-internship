<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library Management System</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f7fb;">
    <div style="max-width: 960px; margin: 0 auto;">
        <header style="margin-bottom: 24px; text-align: center;">
            <h1 style="margin: 0;">Library Management System</h1>
            <p style="color: #4b5563;">Add books, view available titles, and toggle borrowed status.</p>
        </header>

        <section style="background: #ffffff; border-radius: 12px; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); padding: 20px; margin-bottom: 24px;">
            <h2 style="margin-top: 0;">Add New Book</h2>
            <div style="display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));">
                <input id="bookTitle" type="text" placeholder="Title" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; width: 100%;" />
                <input id="bookAuthor" type="text" placeholder="Author" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; width: 100%;" />
                <input id="bookISBN" type="text" placeholder="ISBN" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; width: 100%;" />
                <input id="bookCategory" type="text" placeholder="Category" style="padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; width: 100%;" />
            </div>
            <div style="margin-top: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
                <button id="addBookButton" type="button" style="background: #2563eb; color: white; border: none; border-radius: 8px; padding: 11px 18px; cursor: pointer;">Add Book</button>
                <input id="searchBook" type="text" placeholder="Search by title or author" style="flex: 1; min-width: 220px; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px;" />
                <button id="clearSearchButton" type="button" style="background: #6b7280; color: white; border: none; border-radius: 8px; padding: 11px 18px; cursor: pointer;">Clear</button>
            </div>
        </section>

        <section style="background: #ffffff; border-radius: 12px; box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08); padding: 20px;">
            <h2 style="margin-top: 0;">Library Books</h2>
            <div id="bookList" style="display: grid; gap: 16px;"></div>
        </section>
    </div>

    <script>
        const bookTitle = document.getElementById('bookTitle');
        const bookAuthor = document.getElementById('bookAuthor');
        const bookISBN = document.getElementById('bookISBN');
        const bookCategory = document.getElementById('bookCategory');
        const addBookButton = document.getElementById('addBookButton');
        const searchBook = document.getElementById('searchBook');
        const clearSearchButton = document.getElementById('clearSearchButton');
        const bookList = document.getElementById('bookList');

        let books = [
            { id: 1, title: 'The Great Gatsby', author: 'F. Scott Fitzgerald', isbn: '9780743273565', category: 'Classic', borrowed: false },
            { id: 2, title: '1984', author: 'George Orwell', isbn: '9780451524935', category: 'Dystopian', borrowed: true },
            { id: 3, title: 'Clean Code', author: 'Robert C. Martin', isbn: '9780132350884', category: 'Programming', borrowed: false }
        ];

        function renderBooks(bookArray) {
            if (bookArray.length === 0) {
                bookList.innerHTML = '<p style="color: #6b7280; margin: 0;">No books to display.</p>';
                return;
            }

            bookList.innerHTML = bookArray.map(book => {
                return `
                    <div style="border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px; background: #f9fafb; display: grid; gap: 10px;">
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; align-items: center;">
                            <div>
                                <h3 style="margin: 0 0 6px;">${book.title}</h3>
                                <p style="margin: 0; color: #4b5563;">${book.author} · ${book.category}</p>
                            </div>
                            <span style="padding: 5px 10px; border-radius: 999px; background: ${book.borrowed ? '#f87171' : '#34d399'}; color: white; font-size: 0.9rem;">${book.borrowed ? 'Borrowed' : 'Available'}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 10px; color: #374151;">
                            <p style="margin: 0;"><strong>ISBN:</strong> ${book.isbn}</p>
                            <p style="margin: 0;"><strong>ID:</strong> ${book.id}</p>
                        </div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <button onclick="toggleBorrowed(${book.id})" style="background: ${book.borrowed ? '#f59e0b' : '#10b981'}; color: white; border: none; border-radius: 8px; padding: 9px 14px; cursor: pointer;">${book.borrowed ? 'Return' : 'Borrow'}</button>
                            <button onclick="removeBook(${book.id})" style="background: #ef4444; color: white; border: none; border-radius: 8px; padding: 9px 14px; cursor: pointer;">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function addBook() {
            const title = bookTitle.value.trim();
            const author = bookAuthor.value.trim();
            const isbn = bookISBN.value.trim();
            const category = bookCategory.value.trim();

            if (!title || !author || !isbn || !category) {
                alert('Please fill in all book details.');
                return;
            }

            const duplicate = books.some(book => book.isbn === isbn);
            if (duplicate) {
                alert('A book with this ISBN already exists.');
                return;
            }

            books.push({
                id: Date.now(),
                title,
                author,
                isbn,
                category,
                borrowed: false
            });

            bookTitle.value = '';
            bookAuthor.value = '';
            bookISBN.value = '';
            bookCategory.value = '';
            searchBook.value = '';

            renderBooks(books);
        }

        function toggleBorrowed(bookId) {
            books = books.map(book => {
                if (book.id === bookId) {
                    return { ...book, borrowed: !book.borrowed };
                }
                return book;
            });
            renderBooks(filterBooks());
        }

        function removeBook(bookId) {
            books = books.filter(book => book.id !== bookId);
            renderBooks(filterBooks());
        }

        function filterBooks() {
            const searchValue = searchBook.value.trim().toLowerCase();
            if (!searchValue) return books;

            return books.filter(book => {
                return book.title.toLowerCase().includes(searchValue) || book.author.toLowerCase().includes(searchValue);
            });
        }

        addBookButton.addEventListener('click', addBook);
        searchBook.addEventListener('input', () => renderBooks(filterBooks()));
        clearSearchButton.addEventListener('click', () => {
            searchBook.value = '';
            renderBooks(books);
        });

        renderBooks(books);
    </script>
</body>
</html>
